<script>
/* Inbox: reads feedback from Supabase. Signs in with an email link (no password).
   The table rules only let pankqx@gmail.com read or delete rows. */
(function () {
  var URL_ = 'https://oclkdkonnuggeinbnkyn.supabase.co', KEY = 'sb_publishable_xky8jLFeXFjK6QKcldbi5g_6avxE51n';
  var q = function (s) { return document.querySelector(s); };
  var login = q('[data-login]'), box = q('[data-box]'), list = q('[data-list]'), stats = q('[data-stats]'), lmsg = q('[data-login-msg]');
  var here = location.origin + location.pathname;

  // 1 · coming back from the email link: the token is in the address after #
  var h = new URLSearchParams(location.hash.slice(1));
  if (h.get('access_token')) {
    localStorage.setItem('ksp-inbox', JSON.stringify({ t: h.get('access_token'), exp: Date.now() + (Number(h.get('expires_in')) || 3600) * 1000 }));
    history.replaceState(null, '', here);
  } else if (h.get('error_description')) {
    lmsg.textContent = h.get('error_description').replace(/\+/g, ' ') + '. Ask for a new link.';
    history.replaceState(null, '', here);
  }
  var token = function () {
    try { var s = JSON.parse(localStorage.getItem('ksp-inbox') || 'null'); return s && s.exp > Date.now() + 30000 ? s.t : null; } catch (e) { return null; }
  };
  var api = function (path, opt) {
    opt = opt || {};
    opt.headers = Object.assign({ apikey: KEY, Authorization: 'Bearer ' + token() }, opt.headers || {});
    return fetch(URL_ + path, opt);
  };
  var face = function (n) { return n ? ['😐', '🙂', '😍'][n - 1] : '–'; };
  var esc = function (s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };

  var load = function () {
    list.innerHTML = '<p class="lede">Loading…</p>';
    api('/rest/v1/feedback?select=*&order=created_at.desc').then(function (r) {
      if (r.status === 401) { signOut(); throw new Error('Signed out. Please sign in again.'); }
      if (!r.ok) throw new Error('Could not load (' + r.status + ').');
      return r.json();
    }).then(function (rows) {
      var avg = function (k) { var v = rows.map(function (r) { return r[k]; }).filter(Boolean); return v.length ? (v.reduce(function (a, b) { return a + b; }, 0) / v.length).toFixed(1) : '–'; };
      var played = rows.filter(function (r) { return r.played; }).length;
      stats.innerHTML = '<div><b>' + rows.length + '</b><span>messages</span></div><div><b>' + avg('projects') + '/3</b><span>projects</span></div><div><b>' + avg('site') + '/3</b><span>site</span></div><div><b>' + played + '</b><span>tried Play</span></div>';
      if (!rows.length) { list.innerHTML = '<p class="lede">No feedback yet. It will show up here.</p>'; return; }
      list.innerHTML = rows.map(function (r) {
        var d = new Date(r.created_at);
        return '<article class="ib-card"><div class="ib-meta mono">' + esc(d.toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })) + ' · ' + esc(r.page || '') + '</div>' +
          '<div class="ib-rate">Projects ' + face(r.projects) + ' · Site ' + face(r.site) + ' · Play ' + (r.played == null ? '–' : r.played ? 'yes' : 'not yet') + '</div>' +
          (r.message ? '<p class="ib-msg">' + esc(r.message) + '</p>' : '') +
          (r.contact ? '<p class="ib-from mono">From: ' + esc(r.contact) + '</p>' : '') +
          '<button class="ib-del" type="button" data-del="' + esc(r.id) + '">Delete</button></article>';
      }).join('');
    }).catch(function (e) { list.innerHTML = '<p class="lede">' + esc(e.message) + '</p>'; });
  };
  var show = function () { var on = !!token(); login.hidden = on; box.hidden = !on; if (on) load(); };
  var signOut = function () { localStorage.removeItem('ksp-inbox'); show(); };

  login.addEventListener('submit', function (e) {
    e.preventDefault();
    lmsg.textContent = 'Sending…';
    fetch(URL_ + '/auth/v1/otp?redirect_to=' + encodeURIComponent(here), {
      method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: login.email.value.trim(), create_user: true })
    }).then(function (r) {
      if (r.ok) lmsg.textContent = 'Check your email and tap the link. Open it on this same device.';
      else return r.json().then(function (j) { lmsg.textContent = (j.msg || j.error_description || 'Could not send') + '.'; });
    }).catch(function () { lmsg.textContent = 'No internet?'; });
  });
  list.addEventListener('click', function (e) {
    var b = e.target.closest('[data-del]'); if (!b) return;
    if (!confirm('Delete this feedback for good?')) return;
    api('/rest/v1/feedback?id=eq.' + encodeURIComponent(b.dataset.del), { method: 'DELETE' }).then(function (r) { if (r.ok) b.closest('.ib-card').remove(); });
  });
  q('[data-reload]').addEventListener('click', load);
  q('[data-out]').addEventListener('click', signOut);
  show();
})();
</script>
