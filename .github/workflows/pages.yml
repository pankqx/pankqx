name: Deploy site to GitHub Pages

# Every push to main rebuilds the three resumes from resume/*.tex,
# then publishes the whole site. If LaTeX fails, nothing is published
# and the previous version stays live.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        uses: teatimeguest/setup-texlive-action@v3
        with:
          packages: >-
            scheme-basic
            enumitem
            titlesec
            setspace
            fontawesome5
            lm

      - name: Install PDF and image tools
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils webp

      - name: Build resumes
        run: bash resume/build.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
